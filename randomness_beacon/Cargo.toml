[package]
name = "randomness_beacon"
version = "0.1.0"
edition = "2021"
description = "Tari Ootle commit-then-reveal K-of-N randomness beacon template (v1 research spike)"
license = "BSD-3-Clause"

[package.metadata.tari-template]
tags = ["randomness", "commit-reveal", "federated", "spike"]
category = "gambling"

[dependencies]
tari_template_lib = { version = "0.31.1" }
# Pure computation (no OS/engine calls needed), used inside the WASM template itself to check a
# revealed secret's Blake2s-256 hash against its earlier commitment, and to combine all revealed
# secrets into the final random output. See README "Combination function" for why Blake2s-256
# rather than pulling in the heavier Blake2b-512 the sibling oracle build's *tests* use.
blake2 = { version = "0.10", default-features = false }

[dev-dependencies]
tari_template_test_tooling = "0.40.0"
# Used only in tests, to construct real detached Schnorr signatures the way an off-chain beacon
# signer would -- identical role to the sibling oracle build's dev-dependency of the same name.
tari_ootle_common_types = "0.40.0"
rand = { version = "0.10", features = ["thread_rng"] }

# tari_engine 0.40.0 (pulled in transitively by tari_template_test_tooling) calls
# `wasmer_compiler::BaseTunables::for_target`, which exists in wasmer-compiler 7.1.x-7.3.x but was
# removed by wasmer-compiler 7.4.0. Cargo's default resolver picks the newest semver-compatible
# version (^7.1.0 allows 7.4.0), which breaks the build with an upstream API-compat bug that is
# not ours to fix in a v1 spike. Pin the whole wasmer 7.x family down to the last version known to
# still have `BaseTunables::for_target`. Identical pin to both sibling repos.
wasmer = "=7.1.0"
wasmer-compiler = "=7.1.0"
wasmer-compiler-cranelift = "=7.1.0"
wasmer-middlewares = "=7.1.0"

[lib]
crate-type = ["cdylib"]

# NOTE: `[profile.*]` sections live in the workspace root `Cargo.toml`, not here -- Cargo only
# honours profile settings from the workspace root manifest; settings in a member crate's own
# manifest are silently ignored. See the root `Cargo.toml` for the release/dev profile tuning
# shared by both template crates in this workspace.
